[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

db_host = db
db_port = 5432
db_user = odoo
# db_password et admin_passwd sont injectes au demarrage depuis le fichier .env
# (voir docker-compose.yml) — ne jamais les ecrire en clair ici.

log_level = info

workers = 0
max_cron_threads = 1

proxy_mode = True
