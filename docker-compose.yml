services:
  db:
    image: postgres:16
    container_name: pharmacie_db
    environment:
      POSTGRES_DB: ${DB_NAME:-odoo18}
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definissez DB_PASSWORD dans le fichier .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    container_name: pharmacie_odoo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:?Definissez DB_PASSWORD dans le fichier .env}
      ADMIN_PASSWD: ${ADMIN_PASSWD:?Definissez ADMIN_PASSWD dans le fichier .env}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./pharmacie_management:/mnt/extra-addons/pharmacie_management
      - ./odoo.conf:/etc/odoo/odoo.conf
    restart: unless-stopped
    # Les secrets (.env) sont injectes dans une copie temporaire de la config au demarrage,
    # pour ne jamais les ecrire dans le fichier odoo.conf versionne.
    command: >
      sh -c "cp /etc/odoo/odoo.conf /tmp/odoo.conf &&
             printf 'db_password = %s\nadmin_passwd = %s\n' \"$$PASSWORD\" \"$$ADMIN_PASSWD\" >> /tmp/odoo.conf &&
             exec odoo --config /tmp/odoo.conf"

volumes:
  pgdata:
  odoo_data:
